# Tag-driven release to Maven Central via the Sonatype Central Portal.
#
# Publishing is handled by the com.vanniktech.maven.publish plugin, which
# provides the `publishAndReleaseToMavenCentral` task and reads the POM from
# the POM_*/GROUP/VERSION_NAME values in gradle.properties.
#
# Required repository secrets:
#   SONATYPE_USERNAME       — Central Portal user token name
#   SONATYPE_PASSWORD       — Central Portal user token value
#   SIGNING_KEY             — ASCII-armored GPG private key (gpg --armor --export-secret-keys KEYID)
#   SIGNING_KEY_PASSWORD    — passphrase for SIGNING_KEY
#
# These are mapped below to the ORG_GRADLE_PROJECT_* environment variables the
# plugin consumes (mavenCentralUsername/Password, signingInMemoryKey + its
# password).

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release for the tag
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify build
        run: ./gradlew assemble test --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Also exposed so build.gradle.kts can detect a signing key is present.
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
